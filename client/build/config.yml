version: '3'
info:
  companyName: "Example Org"
  productName: "ssh-vault2"
  productIdentifier: "app.sshvault2.desktop"
  description: "SSH/SFTP desktop client"
  copyright: "(c) 2026 Example Org"
  comments: "SSH/SFTP desktop client"
  version: "1.5.14"
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore]
    watched_extension: ["*.go", "*.js", "*.ts"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
fileAssociations:
other: []
